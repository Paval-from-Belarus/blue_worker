[package]
name = "blue_types"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcode = { version = "0.6.3", default-features = false, features = ["serde"] }
serde = { version = "1.0.215", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.134", default-features = false, features = [] }


[features]
default = ["alloc"]
alloc = ["serde/alloc", "serde_json/alloc"]
