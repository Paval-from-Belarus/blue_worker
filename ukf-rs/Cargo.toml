[package]
name = "ukf-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.33", features = ["std", "serde-serialize", "macros"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = { version = "0.1", features = ["release_max_level_debug"] }

[dev-dependencies]
plotters = { version = "^0.3.6", default-features = false, features = [
	"evcxr",
	"all_series",
	"all_elements",
] }
rand = "0.9"
